# Catálogo de indicadores.
# Los códigos de serie del Banco Central se confirman en la etapa 1 con la función
# SearchSeries de la API: no se copian de internet ni se escriben de memoria.

periodo_extraccion:
  desde: "2005-01-01"   # Un año antes de Bachelet I, para calcular variaciones a 12 meses
  hasta: null           # null = hasta el último dato disponible

bcch:
  # Códigos confirmados con SearchSeries y probados con GetSeries el 2026-11-09.
  # Criterio: series "empalmadas" (sin quiebres por cambio de año base) que
  # cubran todo el período 2005-2026 con un solo código.
  pib:
    descripcion: "PIB, volumen a precios del año anterior encadenado, serie empalmada, referencia 2018"
    unidad: "Miles de millones de pesos encadenados"
    frecuencia: QUARTERLY
    codigo: "F032.PIB.FLU.R.CLP.EP18.Z.Z.0.T"
  imacec:
    descripcion: "Imacec empalmado, serie original (sin desestacionalizar)"
    unidad: "Índice 2018=100"
    frecuencia: MONTHLY
    codigo: "F032.IMC.IND.Z.Z.EP18.Z.Z.0.M"
  ipc:
    # Serie oficial publicada por el INE (variación 12 meses, información histórica).
    # Se usaba antes el empalme del Banco Central a base 2023 (G073.IPC.V12.2023.M), pero
    # la auditoría de datos (src/analysis/auditoria.py) mostró que difiere hasta 1,3 pp de
    # lo publicado en los años de cambio de base del IPC (2009, 2013, 2018, 2023-2024).
    # La meta del Banco Central se evalúa contra la cifra oficial, así que se usa esta.
    descripcion: "IPC general, variación 12 meses, cifra oficial publicada por el INE"
    unidad: "Porcentaje"
    frecuencia: MONTHLY
    codigo: "F074.IPC.IND.Z.EP09.C.M"
    fuente_original: "INE"
  tpm:
    descripcion: "Tasa de Política Monetaria"
    unidad: "Porcentaje"
    frecuencia: DAILY
    codigo: "F022.TPM.TIN.D001.NO.Z.D"
  desempleo:
    descripcion: "Tasa de desocupación nacional, serie histórica (fuente original: INE)"
    unidad: "Porcentaje"
    frecuencia: MONTHLY
    codigo: "F049.DES.TAS.HIST.10.M"
  tipo_cambio:
    descripcion: "Tipo de cambio nominal, dólar observado"
    unidad: "Pesos por dólar"
    frecuencia: DAILY
    codigo: "F073.TCO.PRE.Z.D"
  cobre:
    descripcion: "Precio del cobre refinado, Bolsa de Metales de Londres (BML)"
    unidad: "Dólares por libra"
    frecuencia: MONTHLY    # la serie diaria solo parte en 2012
    codigo: "F019.PPB.PRE.40.M"

  # --- Estadísticas fiscales ---
  # Fuente original: DIPRES. Se obtienen vía la BDE del Banco Central porque DIPRES
  # publica la deuda bruta solo en informes PDF trimestrales, no como serie continua.
  # Validación (2026-11-09): balance 2025 = -2,80% del PIB, igual al 2,8% que informa DIPRES.
  deuda_bruta:
    descripcion: "Deuda bruta del Gobierno Central"
    unidad: "Porcentaje del PIB"
    frecuencia: QUARTERLY
    codigo: "F051.D7.PPB.C.Z.Z.T"
    fuente_original: "DIPRES"
  balance_fiscal:
    descripcion: "Balance global devengado del Gobierno Central (equivale al balance efectivo de DIPRES)"
    unidad: "Porcentaje del PIB"
    frecuencia: ANNUAL
    codigo: "F051.G21.PPI.C.Z.Z.A"
    fuente_original: "DIPRES"

  # --- Agregadas tras la revisión económica (2026-11-11) ---
  # El balance estructural es la meta de la regla fiscal chilena: descuenta el efecto del
  # ciclo económico y del precio del cobre sobre los ingresos. El balance efectivo mezcla
  # la gestión fiscal con esos factores externos.
  balance_estructural:
    descripcion: "Balance estructural (cíclicamente ajustado) del Gobierno Central"
    unidad: "Porcentaje del PIB"
    frecuencia: ANNUAL
    codigo: "F051.G11.PPB.C.Z.CLP.A"
    fuente_original: "DIPRES"
  # La deuda neta descuenta los activos financieros del Fisco (entre ellos los fondos
  # soberanos FEES y FRP). Un valor negativo significa que el Fisco es acreedor neto.
  deuda_neta:
    descripcion: "Deuda neta del Gobierno Central"
    unidad: "Porcentaje del PIB"
    frecuencia: QUARTERLY
    codigo: "F051.D9.PPB.C.Z.Z.T"
    fuente_original: "DIPRES"

  # --- Fondos soberanos (agregados el 2026-11-11) ---
  # Saldos a fin de mes, en millones de dólares de cada año. Cambian por aportes, retiros y
  # rentabilidad. Existen desde marzo de 2007 (antes había un Fondo de Compensación del Cobre).
  fees:
    descripcion: "Fondo de Estabilización Económica y Social (FEES), activos totales"
    unidad: "Millones de dólares"
    frecuencia: MONTHLY
    codigo: "F051.C17.STO.C.Z.USD.M"
    fuente_original: "Ministerio de Hacienda"
  frp:
    descripcion: "Fondo de Reserva de Pensiones (FRP), activos totales"
    unidad: "Millones de dólares"
    frecuencia: MONTHLY
    codigo: "F051.C15.STO.C.Z.USD.M"
    fuente_original: "Ministerio de Hacienda"
  fondos_soberanos:
    descripcion: "Fondos soberanos (FEES y FRP), activos totales"
    unidad: "Millones de dólares"
    frecuencia: MONTHLY
    codigo: "F051.C19.STO.C.Z.USD.M"
    fuente_original: "Ministerio de Hacienda"

  # --- Bienestar (agregadas el 2026-11-11) ---
  # El INE publica el índice real de remuneraciones en dos tramos que no se empalman entre sí:
  # el histórico (base enero 2006 = 100) hasta 2009 y el empalmado (base 2023 = 100) desde 2010.
  # Solo se usan sus variaciones anuales, que sí son comparables. Falta la variación de 2010.
  remuneraciones_reales_hist:
    descripcion: "Índice general de remuneraciones real, INE (enero 2006 = 100), tramo hasta 2009"
    unidad: "Índice"
    frecuencia: MONTHLY
    codigo: "F049.RMU.IND.INE1.82.M"
    fuente_original: "INE"
  remuneraciones_reales:
    descripcion: "Índice real de remuneraciones, serie empalmada, INE (base 2023 = 100), desde 2010"
    unidad: "Índice"
    frecuencia: MONTHLY
    codigo: "G049.RMM.IND.INE23.R.M"
    fuente_original: "INE"
